[workspace]

[package]
name = "molex"
version = "0.8.0"
edition = "2021"
authors = ["Andreas Petrides"]
description = "Parse, analyze, and transform molecular structure data (PDB, mmCIF, BinaryCIF, MRC)"
license = "MIT"
repository = "https://github.com/foldit-org/molex"
readme = "README.md"
keywords = ["protein", "molecular", "pdb", "mmcif", "structure"]
categories = ["science", "parser-implementations", "data-structures"]
# tests/data/ is ~190MiB of structure factors; packaging it puts the .crate
# tarball over the crates.io 10MiB upload cap.
exclude = ["examples/gen_completion_table.rs", "data/ccd/", "tests/data/"]

# argmin-math is a feature-only dependency: its Vec<f64> backend is consumed
# through argmin's generic trait bounds
[package.metadata.cargo-machete]
ignored = ["argmin-math"]

[lib]
name = "molex"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
pyo3 = { version = "0.29", optional = true }
numpy = { version = "0.29", optional = true }
ndarray = "0.15"
thiserror = "2"
glam = "0.30"
rmp = "0.8"
flate2 = "1"
rustc-hash = "2"
compact_str = "0.9"
log = "0.4"
rustfft = { version = "6", optional = true }
argmin = { version = "0.11", optional = true }
argmin-math = { version = "0.5", optional = true, default-features = false, features = [
  "vec",
] }
serde = { version = "1", features = ["derive"], optional = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
cubecl = { version = "0.10", features = ["wgpu"], optional = true }

[build-dependencies]
cbindgen = { version = "0.29", optional = true }

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]
extension-module = ["pyo3/extension-module"]
serde = ["dep:serde"]
specta = ["dep:specta"]
c-api = ["dep:cbindgen"]
xtal = ["dep:rustfft"]
minimization = ["dep:argmin", "dep:argmin-math"]
gpu = ["dep:cubecl"]
testutil = ["xtal"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
testing_logger = "0.1"

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "analysis"
harness = false

[[bench]]
name = "assembly_clone"
harness = false

[[bench]]
name = "writing"
harness = false

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "egress"
harness = false

[[bench]]
name = "xtal_atoms"
harness = false
required-features = ["xtal", "testutil"]

[[bench]]
name = "xtal_grid"
harness = false
required-features = ["xtal", "testutil"]

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
str_to_string = "deny"

multiple_crate_versions = "allow"
missing_const_for_fn = "allow"
default_trait_access = "allow"
doc_markdown = "allow"
similar_names = "allow"
items_after_statements = "allow"
use_self = "allow"
redundant_pub_crate = "allow"

[lints.rust]
missing_docs = "deny"
unused_results = "deny"
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
