[advisories]
unmaintained = "workspace"
ignore = [
    # molex reaches neither vulnerable pyo3 path: no PyCFunction::new_closure use
    # (RUSTSEC-2026-0177), and PyList is only constructed, never .nth()/.nth_back()
    # iterated with an untrusted index (RUSTSEC-2026-0176). pyo3 stays 0.28 (numpy
    # 0.28 caps it); the 0.29 upgrade is tracked under the numpy-version cap.
    "RUSTSEC-2026-0176",
    "RUSTSEC-2026-0177",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
